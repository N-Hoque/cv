name: Build CV PDF

on:
  push:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v3

      - name: Compile cv.typ
        run: typst compile cv.typ cv.pdf

      - name: Set release date
        run: |
          echo "RELEASE_TIMESTAMP=$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_ENV"

      - name: Remove prior releases
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const release of releases) {
              if (!release.tag_name?.startsWith('cv-')) {
                continue;
              }

              if (/^cv-\d{8}T\d{6}Z$/.test(release.tag_name)) {
                continue;
              }

              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`
                });
              } catch (error) {
                if (error.status !== 422 && error.status !== 404) {
                  throw error;
                }
              }
            }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cv-${{ env.RELEASE_TIMESTAMP }}
          name: CV build ${{ env.RELEASE_TIMESTAMP }}
          files: cv.pdf
          generate_release_notes: true
